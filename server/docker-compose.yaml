services:
  db:
    image: mariadb:latest
    container_name: weather-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in server/.env}
      MYSQL_DATABASE: weather_db
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - weather-network

  app:
    build: ./
    container_name: weather-app
    ports:
      - "127.0.0.1:8081:80"
    environment:
      - SQLALCHEMY_DATABASE_URI=mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@db:3306/weather_db
      - FLASK_ENV=production
      - API_KEY_DEVICE=${WEATHER_DEVICE_API_KEY:?Set WEATHER_DEVICE_API_KEY in server/.env}
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:?Set FLASK_SECRET_KEY in server/.env}
    volumes:
      - app-data:/app/data
    depends_on:
      db:
        condition: service_started
    networks:
      - weather-network
    restart: on-failure

networks:
  weather-network:
    driver: bridge

volumes:
  app-data:
  mariadb-data:
