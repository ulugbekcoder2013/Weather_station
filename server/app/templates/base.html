<!doctype html>
<html lang="en" class="h-full">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#090d16">
    <title>{% block title %}Aura — Real-Time Smart Weather Station{% endblock %}</title>
    
    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN for instant rendering -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace']
                    },
                    colors: {
                        aura: {
                            bg: '#090d16',
                            card: '#111827',
                            border: 'rgba(255, 255, 255, 0.08)',
                            cyan: '#06b6d4',
                            amber: '#f59e0b',
                            emerald: '#10b981',
                            rose: '#f43f5e'
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Chart.js & Date Adapter -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            background-color: #090d16;
            color: #f8fafc;
        }
        .mono-num {
            font-family: 'JetBrains Mono', monospace;
            font-variant-numeric: tabular-nums;
        }
        .glass-panel {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-panel-glow:hover {
            border-color: rgba(6, 182, 212, 0.3);
            box-shadow: 0 0 25px rgba(6, 182, 212, 0.1);
        }
        .pulse-indicator {
            box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
            animation: pulse-ring 1.8s infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
    </style>
</head>
<body class="min-h-full flex flex-col antialiased selection:bg-cyan-500 selection:text-black">
    <!-- Navigation Bar -->
    <header class="sticky top-0 z-50 border-b border-white/10 glass-panel">
        <div class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-4 py-3.5 sm:px-6">
            <a href="/" class="flex items-center gap-3 group">
                <div class="grid h-10 w-10 place-items-center rounded-xl bg-gradient-to-tr from-cyan-500 to-emerald-400 text-slate-950 font-extrabold shadow-lg shadow-cyan-500/20 group-hover:scale-105 transition-transform">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                    </svg>
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <span class="text-base font-extrabold tracking-tight text-white">AURA STATION</span>
                        <span class="rounded bg-cyan-500/20 px-1.5 py-0.5 text-[10px] font-bold text-cyan-400 border border-cyan-500/30">REAL-TIME</span>
                    </div>
                    <span class="block text-xs font-medium text-slate-400">Direct ESP32 &middot; DHT11 &amp; Photoresistor</span>
                </div>
            </a>
            
            <div class="flex items-center gap-3">
                <div id="wsIndicator" class="flex items-center gap-2 rounded-full bg-slate-900/90 px-3 py-1.5 border border-white/10 text-xs font-semibold">
                    <span id="wsDot" class="h-2 w-2 rounded-full bg-amber-400 animate-pulse"></span>
                    <span id="wsStatusText" class="text-slate-300">CONNECTING...</span>
                </div>
                <a href="/docs" target="_blank" class="hidden sm:inline-flex items-center gap-1.5 rounded-lg px-3 py-1.5 text-xs font-bold text-slate-300 hover:text-white hover:bg-white/5 border border-white/10 transition">
                    <svg class="w-3.5 h-3.5 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg>
                    API Docs
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="mt-16 border-t border-white/10 glass-panel py-6">
        <div class="mx-auto flex max-w-7xl flex-col gap-3 px-4 text-xs text-slate-400 sm:flex-row sm:items-center sm:justify-between sm:px-6">
            <div class="flex items-center gap-2">
                <span class="h-2 w-2 rounded-full bg-emerald-400"></span>
                <span>Direct ESP32 Sensor Engine (DHT11 Digital + Photoresistor ADC)</span>
            </div>
            <p class="mono-num text-slate-500">FastAPI &middot; Real-Time WebSockets &middot; Sub-millisecond In-Memory Ingestion</p>
        </div>
    </footer>
</body>
</html>
