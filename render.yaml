services:
  - type: web
    name: weather-station-api
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: API_KEY_DEVICE
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: weather-station-db
          property: connectionString

databases:
  - name: weather-station-db
    plan: free
    databaseName: weather_station
    user: weather_station
